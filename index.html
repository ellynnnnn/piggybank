<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Piggy — Savings Tracker</title>

<style>

/* =====================================================
   PERSONNALISATION
   ===================================================== */

:root {

    /* COULEUR DE LA JAUGE */
    --progress-color: #F976C9;

    /* COULEUR DU TEXTE */
    --text-color: #202124;

    /* TEXTE SECONDAIRE */
    --muted-color: #FCB0E0;

    /* PARTIE VIDE DE LA JAUGE */
    --gauge-background: #EDEDED;

    /* BORDURES */
    --border-color: #E5E5E5;

}


/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    background: #FFFFFF;

}


body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: var(--text-color);

    overflow: hidden;

}


/* =====================================================
   WIDGET
   ===================================================== */

.piggy-card {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    background: #FFFFFF;

    border: 1px solid var(--border-color);

    border-radius: 24px;

    overflow: hidden;

    display: flex;
    flex-direction: column;

}


/* =====================================================
   HEADER
   ===================================================== */

.top {

    padding: 20px 22px 16px;

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    gap: 15px;

    flex-shrink: 0;

}


.eyebrow {

    font-size: 11px;

    letter-spacing: 0.09em;

    text-transform: uppercase;

    color: var(--muted-color);

    margin-bottom: 6px;

}


.amount {

    font-size: clamp(28px, 6vw, 40px);

    line-height: 1;

    font-weight: 300;

    letter-spacing: -0.04em;

}


.target {

    font-size: 12px;

    color: var(--muted-color);

    margin-top: 7px;

}


.percent {

    font-size: clamp(20px, 4vw, 27px);

    font-weight: 300;

    letter-spacing: -0.03em;

    text-align: right;

}


.percent-label {

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: 0.08em;

    color: var(--muted-color);

    margin-top: 4px;

    text-align: right;

}


/* =====================================================
   JAUGE
   ===================================================== */

.gauge-wrap {

    padding: 0 22px 19px;

    flex-shrink: 0;

}


.gauge {

    width: 100%;

    height: 9px;

    background: var(--gauge-background);

    border-radius: 999px;

    overflow: hidden;

}


.fill {

    height: 100%;

    width: 0%;

    background: var(--progress-color);

    border-radius: 999px;

    transition: width 0.4s ease;

}


.scale {

    display: flex;

    justify-content: space-between;

    margin-top: 7px;

    font-size: 9px;

    color: #AAAAAA;

}


/* =====================================================
   DIVIDER
   ===================================================== */

.divider {

    width: 100%;

    height: 1px;

    background: var(--border-color);

    flex-shrink: 0;

}


/* =====================================================
   ACTIONS
   ===================================================== */

.actions {

    padding: 18px 22px 20px;

    flex: 1;

    min-height: 0;

    overflow-y: auto;

}


.input-label {

    display: block;

    font-size: 10px;

    color: var(--muted-color);

    text-transform: uppercase;

    letter-spacing: 0.07em;

    margin-bottom: 7px;

}


.amount-input {

    width: 100%;

    height: 43px;

    border: 1px solid var(--border-color);

    border-radius: 12px;

    background: #FAFAFA;

    padding: 0 13px;

    font-size: 16px;

    color: var(--text-color);

    outline: none;

}


.amount-input:focus {

    border-color: #AAAAAA;

    background: #FFFFFF;

}


/* =====================================================
   BOUTONS
   ===================================================== */

.buttons {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    margin-top: 8px;

}


button {

    width: 100%;

    height: 40px;

    border-radius: 12px;

    border: 1px solid var(--border-color);

    font-size: 12px;

    cursor: pointer;

    transition:
        transform 0.12s ease,
        background 0.12s ease;

}


button:active {

    transform: scale(0.98);

}


.add {

    background: var(--text-color);

    color: #FFFFFF;

    border-color: var(--text-color);

}


.remove {

    background: #FFFFFF;

    color: var(--text-color);

}


/* =====================================================
   OBJECTIF
   ===================================================== */

.goal-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-top: 15px;

}


.goal-text {

    font-size: 10px;

    color: var(--muted-color);

}


.goal-input {

    width: 105px;

    height: 32px;

    border: 1px solid var(--border-color);

    border-radius: 9px;

    padding: 0 9px;

    font-size: 12px;

    text-align: right;

    outline: none;

}


/* =====================================================
   MESSAGE
   ===================================================== */

.status {

    min-height: 15px;

    margin-top: 8px;

    font-size: 10px;

    color: var(--muted-color);

}


/* =====================================================
   PETITES LARGEURS
   ===================================================== */

@media (max-width: 350px) {

    .top {

        padding-left: 16px;
        padding-right: 16px;

    }

    .gauge-wrap,
    .actions {

        padding-left: 16px;
        padding-right: 16px;

    }

    .amount {

        font-size: 27px;

    }

    .target {

        font-size: 10px;

    }

}


/* =====================================================
   PETITES HAUTEURS
   ===================================================== */

@media (max-height: 350px) {

    .top {

        padding-top: 12px;
        padding-bottom: 10px;

    }

    .gauge-wrap {

        padding-bottom: 12px;

    }

    .actions {

        padding-top: 12px;
        padding-bottom: 12px;

    }

    .goal-row {

        margin-top: 10px;

    }

}

</style>

</head>


<body>


<div class="piggy-card">


    <!-- HEADER -->

    <div class="top">


        <div>

            <div class="eyebrow">
                Savings
            </div>


            <div
                class="amount"
                id="savedAmount">

                €0

            </div>


            <div class="target">

                sur un objectif de

                <span id="targetAmount">
                    €5 000
                </span>

            </div>

        </div>


        <div>

            <div
                class="percent"
                id="percent">

                0%

            </div>


            <div class="percent-label">

                progression

            </div>

        </div>

    </div>


    <!-- JAUGE -->

    <div class="gauge-wrap">

        <div class="gauge">

            <div
                class="fill"
                id="fill">
            </div>

        </div>


        <div class="scale">

            <span>
                €0
            </span>

            <span id="scaleTarget">
                €5 000
            </span>

        </div>

    </div>


    <div class="divider"></div>


    <!-- ACTIONS -->

    <div class="actions">


        <label
            class="input-label"
            for="changeAmount">

            Montant

        </label>


        <input
            class="amount-input"
            id="changeAmount"
            type="number"
            min="0"
            step="0.01"
            value="50"
            inputmode="decimal"
            placeholder="50">


        <div class="buttons">


            <button
                class="add"
                id="addButton"
                type="button">

                + Ajouter

            </button>


            <button
                class="remove"
                id="removeButton"
                type="button">

                − Retirer

            </button>

        </div>


        <!-- OBJECTIF -->

        <div class="goal-row">

            <span class="goal-text">

                Modifier mon objectif

            </span>


            <input
                class="goal-input"
                id="goalInput"
                type="number"
                min="1"
                step="1"
                value="5000">

        </div>


        <div
            class="status"
            id="status">

        </div>

    </div>


</div>



<script>


/* =====================================================
   DONNÉES
   ===================================================== */


let saved =

    Number(
        localStorage.getItem("piggySaved")
    ) || 0;


let goal =

    Number(
        localStorage.getItem("piggyGoal")
    ) || 5000;



/* =====================================================
   ÉLÉMENTS
   ===================================================== */


const savedAmount =
    document.getElementById("savedAmount");

const targetAmount =
    document.getElementById("targetAmount");

const scaleTarget =
    document.getElementById("scaleTarget");

const percent =
    document.getElementById("percent");

const fill =
    document.getElementById("fill");

const changeAmount =
    document.getElementById("changeAmount");

const goalInput =
    document.getElementById("goalInput");

const addButton =
    document.getElementById("addButton");

const removeButton =
    document.getElementById("removeButton");

const status =
    document.getElementById("status");



/* =====================================================
   FORMAT EURO
   ===================================================== */


function euro(number) {

    return new Intl.NumberFormat(
        "fr-FR",
        {
            style: "currency",
            currency: "EUR",
            maximumFractionDigits: 2
        }
    ).format(number);

}



/* =====================================================
   SAUVEGARDE
   ===================================================== */


function saveData() {

    localStorage.setItem(
        "piggySaved",
        saved
    );

    localStorage.setItem(
        "piggyGoal",
        goal
    );

}



/* =====================================================
   AFFICHAGE
   ===================================================== */


function render() {


    saved = Math.max(
        0,
        saved
    );


    goal = Math.max(
        1,
        goal
    );


    const percentage =

        Math.min(
            100,
            (saved / goal) * 100
        );


    savedAmount.textContent =
        euro(saved);


    targetAmount.textContent =
        euro(goal);


    scaleTarget.textContent =
        euro(goal);


    percent.textContent =

        Math.round(
            percentage
        ) + "%";


    fill.style.width =
        percentage + "%";


    /* MESSAGE */


    if (saved >= goal) {

        status.textContent =
            "Objectif atteint ✦";

    }

    else if (saved > 0) {

        const remaining =
            goal - saved;

        status.textContent =

            "Encore " +
            euro(remaining) +
            " pour atteindre ton objectif.";

    }

    else {

        status.textContent =

            "Commence à épargner pour faire monter la jauge.";

    }


    saveData();

}



/* =====================================================
   MONTANT
   ===================================================== */


function getAmount() {

    const value =

        Number.parseFloat(
            changeAmount.value
        );


    if (
        !Number.isFinite(value) ||
        value <= 0
    ) {

        return 0;

    }


    return value;

}



/* =====================================================
   AJOUTER
   ===================================================== */


addButton.addEventListener(
    "click",
    function() {

        const amount =
            getAmount();


        if (!amount) {

            status.textContent =
                "Entre un montant supérieur à 0 €.";

            return;

        }


        saved += amount;

        render();

    }
);



/* =====================================================
   RETIRER
   ===================================================== */


removeButton.addEventListener(
    "click",
    function() {

        const amount =
            getAmount();


        if (!amount) {

            status.textContent =
                "Entre un montant supérieur à 0 €.";

            return;

        }


        saved =
            Math.max(
                0,
                saved - amount
            );

        render();

    }
);



/* =====================================================
   MODIFIER L'OBJECTIF
   ===================================================== */


goalInput.value = goal;


goalInput.addEventListener(
    "change",
    function() {

        const newGoal =
            Number.parseFloat(
                goalInput.value
            );


        if (
            !Number.isFinite(newGoal) ||
            newGoal <= 0
        ) {

            goalInput.value =
                goal;

            status.textContent =
                "L'objectif doit être supérieur à 0 €.";

            return;

        }


        goal = newGoal;

        render();

    }
);



/* =====================================================
   INITIALISATION
   ===================================================== */


render();


</script>


</body>

</html>
